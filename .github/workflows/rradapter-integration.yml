name: Factoria fast regression

on:
  push:
    branches: [main]
    paths:
      - 'Factograph.Data/**'
      - 'tests/**'
      - 'Factoria.Tests.sln'
      - '.github/workflows/rradapter-integration.yml'
  pull_request:
    paths:
      - 'Factograph.Data/**'
      - 'tests/**'
      - 'Factoria.Tests.sln'
      - '.github/workflows/rradapter-integration.yml'

permissions:
  contents: read

jobs:
  contracts-and-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Contract tests via IFDataService
        run: dotnet test tests/Factograph.Data.Tests/Factograph.Data.Tests.csproj --configuration Release --verbosity minimal
      - name: Build RRAdapter smoke suite
        run: dotnet build tests/RRAdapter.Integration/RRAdapter.Integration.csproj --configuration Release
      - name: RRAdapter smoke regressions
        run: dotnet run --project tests/RRAdapter.Integration/RRAdapter.Integration.csproj --configuration Release --no-build
